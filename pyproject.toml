[project]
name = "langchain-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Goudham T", email = "goudhamvel.88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain==1.2.11",
    "langchain-community==0.4.1",
    "langchain-core==1.2.18",
    "langchain-openai>=1.1.11",
    "langchain-openrouter>=0.1.0",
    "langchain-tavily>=0.2.18",
    "langchainhub>=0.1.21",
    "python-dotenv>=1.2.4",
    "requests==2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
langchain-agent = "langchain_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
